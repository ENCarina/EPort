<app-navigation></app-navigation>
<div class="main-content">
  <div class="profile-container">
    <h1>Profilom</h1>

    <div class="profile-info">
      <h2>Fiók információk</h2>
      <div class="info-group">
        <label>Név:</label>
        <p>{{ user?.name }}</p>
      </div>
      <div class="info-group">
        <label>Email:</label>
        <p>{{ user?.email }}</p>
      </div>
    </div>

    <div class="password-section">
      <h2>Jelszó megváltoztatása</h2>

      <div *ngIf="message" class="success-message">{{ message }}</div>
      <div *ngIf="error" class="error-message">{{ error }}</div>

      <form (ngSubmit)="handlePasswordChange()">
        <div class="form-group">
          <label for="current">Jelenlegi jelszó</label>
          <input
            id="current"
            type="password"
            [(ngModel)]="passwordForm.currentPassword"
            name="currentPassword"
            required
          />
        </div>

        <div class="form-group">
          <label for="new">Új jelszó</label>
          <input
            id="new"
            type="password"
            [(ngModel)]="passwordForm.newPassword"
            name="newPassword"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm">Új jelszó megerősítése</label>
          <input
            id="confirm"
            type="password"
            [(ngModel)]="passwordForm.confirmPassword"
            name="confirmPassword"
            required
          />
        </div>

        <button type="submit" [disabled]="loading" class="btn btn-primary">
          {{ loading ? 'Frissítés...' : 'Jelszó frissítése' }}
        </button>
      </form>
    </div>

    <div class="logout-section">
      <button (click)="logout()" class="btn btn-danger">
        Kijelentkezés
      </button>
    </div>
  </div>
</div>
