<app-navigation></app-navigation>
<div class="main-content">
  <div *ngIf="loading" class="loading">Betöltés...</div>

  <div *ngIf="!loading && !staff" class="error-message">A szakember nem található</div>

  <div *ngIf="!loading && staff" class="detail-container">
    <button (click)="goBack()" class="btn-back">← Vissza</button>

    <div class="detail-content">
      <h1>{{ getStaffName() }}</h1>
      <p class="specialty">{{ getSpecialty() }}</p>
      <p class="bio">{{ getBio() }}</p>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <div class="booking-section">
        <h2>Időpont foglalása</h2>

        <div class="form-group">
          <label>Elérhető időpontok</label>
          <div class="slots-list">
            <button
              *ngFor="let slot of slots"
              [class.selected]="selectedSlot?.id === slot.id"
              class="slot-option"
              (click)="selectSlot(slot)"
            >
              {{ formatSlotDateTime(slot) }}
            </button>

            <p *ngIf="slots.length === 0">Nincsenek elérhető időpontok</p>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Megjegyzések (nem kötelező)</label>
          <textarea
            id="notes"
            [(ngModel)]="notes"
            name="notes"
            placeholder="Adjon hozzá megjegyzéseket a konzultációhoz..."
            rows="4"
          ></textarea>
        </div>

        <button
          (click)="handleBooking()"
          [disabled]="!selectedSlot || bookingLoading"
          class="btn btn-primary"
        >
          {{ bookingLoading ? 'Foglalás...' : 'Foglalás megerősítése' }}
        </button>
      </div>
    </div>
  </div>
</div>
