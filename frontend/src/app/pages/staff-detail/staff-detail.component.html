<app-navigation></app-navigation>
<div class="main-content">
  <div *ngIf="loading" class="loading">Betöltés...</div>

  <div *ngIf="!loading && !staff" class="error-message">A szakember nem található</div>

  <div *ngIf="!loading && staff" class="detail-container">
    <button (click)="goBack()" class="btn-back">← Vissza</button>

    <div class="detail-content">
      <h1>{{ getStaffName() }}</h1>
      <p class="specialty">{{ getSpecialty() }}</p>
      <p class="bio">{{ getBio() }}</p>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <div class="booking-section">
        <h2>Időpont foglalása</h2>
        <p>Itt ugyanaz a foglalási folyamat indul, mint a felső "Időpont foglalás" menüpontban.</p>
        <button (click)="goToBooking()" class="btn btn-primary">
          Tovább a foglaláshoz
        </button>
      </div>
    </div>
  </div>
</div>
