<div class="auth-container login-auth-container">
  <div class="auth-box">
    <h1>Magánklinika Időpontfoglaló Rendszer</h1>
    <h2>Bejelentkezés</h2>
    
    <div *ngIf="error" class="error-message">{{ error }}</div>
    
    <form (ngSubmit)="handleSubmit()">
      <div class="form-group">
        <label for="email">Email cím</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Adja meg az email címét"
        />
      </div>

      <div class="form-group">
        <label for="password">Jelszó</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Adja meg a jelszavát"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary">
        {{ loading ? 'Bejelentkezés...' : 'Bejelentkezés' }}
      </button>
    </form>

    <div class="demo-section">
      <p class="demo-label">Tesztelés?</p>
      <button type="button" (click)="handleDemoLogin()" [disabled]="loading" class="btn btn-demo">
        Belépés páciensként (demo)
      </button>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <button type="button" (click)="toggleDoctorLogins()" [disabled]="loading" class="btn btn-demo">
          Belépés orvosként
        </button>
        <button type="button" (click)="toggleAdminLogins()" [disabled]="loading" class="btn btn-demo">
          Belépés adminként
        </button>
      </div>

      <div *ngIf="showDoctorLogins" class="doctor-login-list" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <p class="demo-label">Válasszon orvost:</p>
        <button
          type="button"
          *ngFor="let doctor of doctorAccounts"
          (click)="handleDoctorLogin(doctor.email)"
          [disabled]="loading"
          class="btn btn-primary"
        >
          {{ doctor.name }}
        </button>
      </div>

      <div *ngIf="showAdminLogins" class="doctor-login-list" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <p class="demo-label">Válasszon vezető asszisztenst:</p>
        <button
          type="button"
          *ngFor="let assistant of assistantAccounts"
          (click)="handleAdminLogin(assistant.email)"
          [disabled]="loading"
          class="btn btn-primary"
        >
          {{ assistant.name }}
        </button>
      </div>
    </div>

    <p class="auth-link">
      Nincs még fiókja? <a routerLink="/register">Regisztráció</a>
    </p>
  </div>
</div>
