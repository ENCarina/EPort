<div class="auth-container">
  <div class="auth-box">
    <h1>Magánklinika Időpontfoglaló Rendszer</h1>
    <h2>Fiók létrehozása</h2>
    
    <div *ngIf="error" class="error-message">{{ error }}</div>
    
    <form (ngSubmit)="handleSubmit()">
      <div class="form-group">
        <label for="name">Teljes név</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          placeholder="Adja meg a teljes nevét"
        />
      </div>

      <div class="form-group">
        <label for="email">Email cím</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Adja meg az email címét"
        />
      </div>

      <div class="form-group">
        <label for="password">Jelszó</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Adja meg a jelszavát"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Jelszó megerősítése</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          placeholder="Erősítse meg a jelszavát"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary">
        {{ loading ? 'Fiók létrehozása...' : 'Regisztráció' }}
      </button>
    </form>

    <p class="auth-link">
      Már van fiókja? <a routerLink="/login">Bejelentkezés</a>
    </p>
  </div>
</div>
